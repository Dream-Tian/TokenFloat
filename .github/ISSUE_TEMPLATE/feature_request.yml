name: 功能建议
description: 提议新的用量展示或桌面体验
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 说明现在遇到的问题，以及它对日常使用的影响。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 描述你希望 TokenFloat 如何表现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 如有替代做法或界面参考，可在这里补充。
